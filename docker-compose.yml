services:
  soundguard:
    build: .
    image: soundguard:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      WEB_DIST: /app/web/dist
      BIND_ADDR: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - soundguard-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  soundguard-data:
