[package]
name = "soundguard-client"
version = "0.2.0"
edition = "2021"
rust-version = "1.77.2"
description = "SoundGuard native edge collector"
license = "MIT"


[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }

[dependencies]
nnnoiseless = { version = "0.5.2", default-features = false }
tauri = { version = "=2.2.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
wasapi = "=0.19.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
webview2-com = "=0.34.0"

